# One command from a clean clone:   cp .env.example .env && docker compose up --build
# Scale the agent workers:          docker compose up --build --scale worker=3
# Deployment boundaries and why they are where they are: docs/ARCHITECTURE.md section 4.
name: export-classifier

x-app: &app
  build:
    context: .
    args:
      WITH_ST: ${WITH_ST:-0}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  env_file: .env
  restart: unless-stopped

services:
  redis:                                   # queue + run store + caches + rate limits + traces
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--protected-mode", "no"]   # no host port: reachable only on the compose network
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  chroma:                                  # vector store server (same image: chromadb is already installed there)
    <<: *app
    command: ["chroma", "run", "--host", "0.0.0.0", "--port", "8000", "--path", "/data/chroma"]
    volumes: ["chroma_data:/data"]
    user: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v2/heartbeat', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  llm-stub:                                # OpenAI-compatible stub: fixed responses after STUB_DELAY_S (D6)
    <<: *app
    command: ["python", "-m", "stub.llm_stub"]
    environment:
      SERVICE_NAME: llm-stub
    ports: ["8080:8080"]          # published so the breaker demonstration can flip /admin/mode from the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:                                  # one-shot: parse -> chunk -> embed -> index. Idempotent; safe to re-run.
    <<: *app
    command: ["python", "-m", "app.corpus.ingest"]
    restart: "no"
    environment:
      SERVICE_NAME: ingest
    depends_on:
      redis: {condition: service_healthy}
      chroma: {condition: service_healthy}

  api:                                     # FastAPI: validation, quarantine, enqueue, status, web client
    <<: *app
    environment:
      SERVICE_NAME: api
    ports: ["8000:8000"]
    depends_on:
      redis: {condition: service_healthy}
      chroma: {condition: service_healthy}
      ingest: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  worker:                                  # agent workers: scale with --scale worker=N. No host port, so replicas do not clash.
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment:
      SERVICE_NAME: worker
      WORKER_METRICS_PORT: "9101"
    depends_on:
      redis: {condition: service_healthy}
      chroma: {condition: service_healthy}
      llm-stub: {condition: service_healthy}
      ingest: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9101/metrics', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  jaeger:                                  # traces (OTLP/HTTP in on 4318, UI on 16686)
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports: ["9090:9090"]
    depends_on: [api]
    restart: unless-stopped

  cadvisor:                                # per-container CPU / memory / start time (resource utilisation + uptime)
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    devices: ["/dev/kmsg"]
    ports: ["8081:8080"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      # local demonstration only: anonymous access, so no credential exists anywhere in the repository (D4)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/export-classifier.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  locust:                                  # load test with the stub as the LLM:  docker compose --profile loadtest up locust
    <<: *app
    profiles: ["loadtest"]
    command: ["python", "-m", "locust", "-f", "loadtest/locustfile.py", "--host", "http://api:8000", "--web-port", "8089"]
    environment:
      SERVICE_NAME: locust
    ports: ["8089:8089"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  redis_data:
  chroma_data:
  prom_data:
